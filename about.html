<html>
<link href="https://googleapis.com" rel="stylesheet">
	<head>
	
		<title>Xyrelium</title>
	</head>
	<style>
		body{
			margin:0;
			min-height:100vh;
			background-image:url("https://raw.githubusercontent.com/XyrelMC/xyrelmc.github.io/refs/heads/main/assets/background.webp");	
			background-position: center;
			background-repeat: repeat;
			background-size: cover;
			background-attachment: fixed;
		}
		#bar{
			height:100px;
			background-color: rgb(0,0,0,0.4);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter:blur(10px);
			color: white; 
			padding: 10px;
			position: fixed;
			width: 100%;
			top: 0;
			left:0;
			z-index:1000;
			display: flex;
			flex-direction: column;
			
		}
		#home{
			font-size:40px;

		}
		
		textarea{
			margin-top: -50px;
			width: 30%;
			padding: 30px;
			border:1px solid rgb(69,69,69);
			border-radius: 32px;
			background-color: rgb(49, 49, 49,0.5);
			backdrop-filter: blur(10px); /* blur for chromium browsers */
			-webkit-backdrop-filter: blur(10px); /* i think this is blur for safari */
			font-family:helvetica;
			font-size: 20px;
			margin-left: auto;
			margin-right: auto;
			text-color: white;
			color: white;
			transition:0.3s;
			
		}
		
		textarea:hover{
			box-shadow: 0 8px 30px rgba(0,0,0,0.5);
			transform: translateY(-3px); /* card move upwards by 3 pixels */
		}
		
		#post_button{
			border:1px solid white;
			padding: 4px;
			border-radius:15px;
			font-size:20px;
			background-color:rgb(0,0,0,0.7);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter:blur(10px);
			color: white;
			padding: 8px;
		}
		#post_bar{
			margin-top: 240px;
			background-color: transparent;
			padding: 10px;
		}
		.post{
			padding:20px;
			font-family: helvetica;
			font-weight: lighter;
			font-size:30px;
			display:block;
			border:1px solid rgb(69,69,69);
			background-color:rgb(49,49,49,0.4);
			backdrop-filter:blur(10px);
			-webkit-backdrop-filter:blur(10px);
			width: 1000px;
			height: 400px;
			border-radius: 30px;
			margin: 20px;
			color: white;
			transition: 0.3s;
			align-items: center;
			
		}
		.post:hover{
			box-shadow: 0 8px 30px rgba(0,0,0,0.5);
			transform: translateY(-3px); /* card move upwards by 3 pixels */
				
		}
	</style>
	<body style="font-family: helvetica neue; height:100%">

		<!--posts-->
		<div id="post_bar">
		<div align="center">
			<!--post 1-->
			<div class="post">
				<div align="left">
				<div>
					<div style = "font-weight: bold; color: gray">About Me</div> Hi! My name is Marcus, I am an 18 year old college student from Malaysia! 
					<br></br>
					- Xyrelium

				</div>
			</div>
		</div>

		</div>
		

		
			
	</body>



</html>
